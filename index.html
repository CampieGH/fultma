<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Стильная карточка новости</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #1e1e1e;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 50px;
    color: #fff;
  }
  #card {
    width: 450px;
    padding: 25px 30px;
    border-radius: 20px;
    background: linear-gradient(135deg, #ff4d6d, #ff7f50);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    text-align: center;
    position: relative;
    min-height: 200px;
  }
  #logo {
    width: 70px;
    position: absolute;
    top: 20px;
    right: 20px;
    border-radius: 10px;
  }
  #text {
    margin-top: 40px;
    font-size: 20px;
    line-height: 1.5;
    font-weight: 500;
    word-wrap: break-word;
    outline: none;
    color: #fff;
  }
  #controls {
    margin-top: 25px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }
  input[type="file"] {
    display: none;
  }
  label {
    cursor: pointer;
    background: #4caf50;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    font-weight: 600;
  }
  #downloadBtn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #2196f3;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
<h2>Редактор карточки новости</h2>
<div id="card">
  <img id="logo" src="" alt="Лого">
  <div id="text" contenteditable="true">Напиши сюда текст новости...</div>
</div>

<div id="controls">
  <label for="logoInput">Загрузить лого</label>
  <input type="file" id="logoInput" accept="image/*">
  <button id="downloadBtn">Скачать JPG</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // Загрузка лого
  const logoInput = document.getElementById('logoInput');
  const logoImg = document.getElementById('logo');
  logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(event){
        logoImg.src = event.target.result;
      }
      reader.readAsDataURL(file);
    }
  });

  // Скачать карточку как JPG
  const btn = document.getElementById('downloadBtn');
  btn.addEventListener('click', () => {
    const card = document.getElementById('card');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = 'news_card.jpg';
      link.href = canvas.toDataURL("image/jpeg", 0.9);
      link.click();
    });
  });
</script>
</body>
</html>
