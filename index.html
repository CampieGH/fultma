<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФУЛТЬМА</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    body {
      background: radial-gradient(circle at 30% 10%, #1a1a2e, #0f0f17);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 25px 0 15px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .feed {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 16px 18px;
      transition: 0.3s;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .card h3 {
      font-size: 17px;
      margin-bottom: 8px;
      color: #f0f0f0;
    }

    .card p {
      font-size: 14px;
      color: #d2d2d2;
      line-height: 1.5;
    }

    .short {
      opacity: 0.9;
      font-style: italic;
    }

    .nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-radius: 40px;
      width: 90%;
      max-width: 420px;
      padding: 12px 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .nav button {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      opacity: 0.8;
      transition: 0.2s;
    }

    .nav button.active,
    .nav button:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @media (min-width: 800px) {
      body {
        justify-content: center;
        align-items: center;
      }
      .feed {
        max-width: 600px;
      }
    }
  </style>
</head>
<body>
  <header>ФУЛТЬМА</header>
  <div class="feed" id="feed"></div>

  <div class="nav">
    <button class="active">🏠</button>
    <button>📝</button>
    <button>✨</button>
    <button>⚙️</button>
  </div>

  <script>
    const feed = document.getElementById('feed');

    const posts = [
      { type: 'post', title: 'Какой вайб у осени?', text: 'Туман, мягкий шум и мысли, что всё снова повторится. Но по-другому.' },
      { type: 'short', title: 'Мнение', text: 'Всё лучше ночью.' },
      { type: 'post', title: 'Фултьма как пространство', text: 'Это не просто контент. Это настроение. Твоя лента — как отражение внутреннего шума.' },
      { type: 'short', title: 'Мнение', text: 'Молчание громче.' }
    ];

    posts.forEach(post => {
      const card = document.createElement('div');
      card.classList.add('card');
      if (post.type === 'short') card.classList.add('short');
      card.innerHTML = `<h3>${post.title}</h3><p>${post.text}</p>`;
      if (post.type === 'post') {
        card.addEventListener('click', () => alert('Открыт пост: ' + post.title));
      }
      feed.appendChild(card);
    });
  </script>
</body>
</html>
