<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лента постов | Минимализм</title>
<style>
:root {
  --bg-dark: #0f0f0f;
  --glass: rgba(255,255,255,0.05);
  --text-main: #e0e0e0;
  --text-secondary: #888;
  --accent: #a0c4ff;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }

body {
  background: var(--bg-dark);
  color: var(--text-main);
  padding: 20px;
}

/* Лента */
.feed {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Карточка поста (открываемая) */
.post-card {
  background: var(--glass);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1);
  padding: 20px;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.post-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.post-title {
  font-weight: 600;
  font-size: 18px;
  color: var(--accent);
  margin-bottom: 10px;
}

.post-excerpt {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.5;
}

/* Мнения / короткие посты */
.opinion-card {
  background: var(--glass);
  backdrop-filter: blur(10px);
  border-radius: 12px;
  border-left: 3px solid var(--accent);
  padding: 15px;
  color: var(--text-main);
  font-size: 14px;
  line-height: 1.4;
}

/* Модальное открытие поста */
.modal {
  display: none;
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.9);
  overflow-y: auto;
  padding: 40px 20px;
  z-index: 1000;
}

.modal-content {
  max-width: 800px;
  margin: 0 auto;
  background: var(--glass);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 30px;
  border: 1px solid rgba(255,255,255,0.1);
}

.close-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 16px;
  cursor: pointer;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<div class="feed">
  <!-- Карточка поста -->
  <div class="post-card" onclick="openPost(1)">
    <div class="post-title">Заголовок поста 1</div>
    <div class="post-excerpt">Краткое описание поста — пара строк текста, чтобы заинтриговать.</div>
  </div>

  <div class="post-card" onclick="openPost(2)">
    <div class="post-title">Заголовок поста 2</div>
    <div class="post-excerpt">Еще один пост с минимальным описанием.</div>
  </div>

  <!-- Мнения -->
  <div class="opinion-card">Это короткая мысль или мнение, не кликается, просто для визуальной ленты.</div>
  <div class="opinion-card">Еще одна заметка, например цитата или мини-пост.</div>
</div>

<!-- Модальное окно для постов -->
<div id="modal" class="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">Закрыть ×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const posts = {
  1: {
    title: "Заголовок поста 1",
    content: "<p>Полный текст поста 1. Здесь можно добавить любое содержимое — параграфы, картинки и т.д.</p><p>Дополнительный текст поста 1 для примера.</p>"
  },
  2: {
    title: "Заголовок поста 2",
    content: "<p>Полный текст поста 2. Тоже можно что угодно вставлять, включая html элементы.</p>"
  }
};

function openPost(id) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modal-body');
  body.innerHTML = `<h2>${posts[id].title}</h2>${posts[id].content}`;
  modal.style.display = 'block';
}

function closeModal() {
  document.getElementById('modal').style.display = 'none';
}
</script>

</body>
</html>
