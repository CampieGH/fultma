<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Карточка — фултьма</title>

  <!-- Подключил Inter и Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Iso&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Ваши существующие стили остаются без изменений */
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(400px 400px at 50% 5%, rgba(255,255,255,0.15), transparent),
        radial-gradient(400px 400px at 20% 30%, rgba(255,255,255,0.17), transparent),
        radial-gradient(300px 300px at 80% 20%, rgba(255,255,255,0.13), transparent),
        radial-gradient(500px 500px at 50% 60%, rgba(255,255,255,0.18), transparent),
        linear-gradient(180deg, #0b0c10 0%, #07080b 100%);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 540px;
      height: 960px;
      background: #0a0a0a;
      backdrop-filter: blur(2px);
      color: #f2f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 50px;
      box-sizing: border-box;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      margin-top: 80px;
    }

    .card-inner {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      font-family: 'Rubik Iso', sans-serif;
      font-size: 38px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 24px;
    }

    .date {
      font-size: 20px;
      color: #a9b0be;
      margin-bottom: 20px;
    }

    .title {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 22px;
      color: #a9b0be;
      margin-bottom: 24px;
    }

    /* Стили для изображения */
    .card-image {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .image-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 28px;
      color: #ffffff;
    }

    .content {
      font-size: 24px;
      line-height: 1.5;
      font-family: 'Roboto', sans-serif;
    }

    .content p {
      margin-bottom: 24px;
    }

    /* Стили для сортировки */
    .sortable-item {
      cursor: move;
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(255,255,255,0.1);
    }

    .sortable-item.dragging {
      opacity: 0.5;
      background: rgba(255,255,255,0.08);
    }

    .editor {
      width: min(540px, 92vw);
      background: #1a1c22;
      padding: 24px;
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-top: 120px;
      display: grid;
      gap: 14px;
    }

    .editor h3 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .editor input,
    .editor textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      background: #101217;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .editor button {
      padding: 10px 20px;
      background: #ffffff1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .editor button:hover {
      background: #ffffff2d;
    }

    #downloadBtn {
      margin: 40px auto;
      padding: 12px 24px;
      font-size: 16px;
      background: #ffffff1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: block;
    }

    /* Стили для загрузки изображения */
    .image-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .image-upload-btn {
      padding: 8px 16px;
      background: #ffffff1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .image-upload-btn:hover {
      background: #ffffff2d;
    }

    .remove-image {
      padding: 8px 16px;
      background: rgba(255, 0, 0, 0.2);
      color: #ff6b6b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .remove-image:hover {
      background: rgba(255, 0, 0, 0.3);
    }

    .image-section {
      margin-bottom: 24px;
    }

    .section-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .image-preview {
      position: relative;
      margin-bottom: 10px;
    }

    .image-preview img {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
    }

    .drag-handle {
      cursor: move;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      margin-bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .drag-handle::before {
      content: "☰";
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-inner">
      <div class="logo" id="logoView">фултьма</div>
      <div class="date" id="dateView">дата</div>
      
      <!-- Контейнер для сортируемых элементов -->
      <div id="sortableContainer">
        <div class="sortable-item" data-type="main-title">
          <h1 class="title" id="titleView">-</h1>
          <p class="subtitle" id="subtitleView">ТГК: ФУЛТЬМА</p>
        </div>
        
        <!-- Контейнер для изображений будет добавляться сюда -->
      </div>
      
      <div class="content" id="contentView">
        <p>-</p>
      </div>
    </div>
  </div>

  <div class="editor">
    <h3>Редактировать карточку</h3>
    
    <!-- Основные поля -->
    <input type="text" id="logoInput" placeholder="Логотип" />
    <input type="text" id="dateInput" placeholder="Дата" />
    <input type="text" id="titleInput" placeholder="Заголовок" />
    <input type="text" id="subtitleInput" placeholder="Подзаголовок" />
    
    <!-- Управление изображениями -->
    <div class="section-controls">
      <button class="image-upload-btn" onclick="addImageSection()">+ Добавить изображение с заголовком</button>
    </div>
    
    <!-- Секции изображений -->
    <div id="imageSections"></div>
    
    <textarea id="contentInput" placeholder="Текст (абзацы через пустую строку)"></textarea>
    <button onclick="applyChanges()">Применить изменения</button>
  </div>

  <button id="downloadBtn">Скачать для TikTok</button>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    let imageSections = [];
    let dragSrcElement = null;

    // Функция для обновления даты
    function updateDate() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = String(now.getFullYear()).slice(-2);
        return `${day}.${month}.${year}`;
    }

    // Устанавливаем сегодняшнюю дату при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('dateView').textContent = updateDate();
        document.getElementById('dateInput').value = updateDate();
        initSortable();
    });

    // Добавление новой секции с изображением
    function addImageSection(imageSrc = '', title = '') {
        const sectionId = 'image_' + Date.now();
        imageSections.push({
            id: sectionId,
            image: imageSrc,
            title: title
        });
        
        renderImageSections();
    }

    // Удаление секции изображения
    function removeImageSection(sectionId) {
        imageSections = imageSections.filter(section => section.id !== sectionId);
        renderImageSections();
        updateCard();
    }

    // Отрисовка секций изображений в редакторе
    function renderImageSections() {
        const container = document.getElementById('imageSections');
        container.innerHTML = '';
        
        imageSections.forEach((section, index) => {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'image-section';
            sectionDiv.innerHTML = `
                <div class="drag-handle">Перетащите для изменения порядка</div>
                <div class="image-controls">
                    <input type="file" class="section-image-input" data-id="${section.id}" accept="image/*" style="display: none;">
                    <button class="image-upload-btn" onclick="document.querySelector('[data-id=\\'${section.id}\\']').click()">Выбрать изображение</button>
                    <input type="text" class="section-title-input" data-id="${section.id}" placeholder="Заголовок для изображения" value="${section.title}">
                    <button class="remove-image" onclick="removeImageSection('${section.id}')">Удалить</button>
                </div>
                ${section.image ? `
                <div class="image-preview">
                    <img src="${section.image}" alt="Предпросмотр">
                </div>
                ` : ''}
            `;
            container.appendChild(sectionDiv);
            
            // Обработчик загрузки изображения
            const fileInput = sectionDiv.querySelector('.section-image-input');
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const sectionId = this.resultSectionId;
                        const section = imageSections.find(s => s.id === sectionId);
                        if (section) {
                            section.image = event.target.result;
                            renderImageSections();
                            updateCard();
                        }
                    }
                    reader.resultSectionId = section.id;
                    reader.readAsDataURL(file);
                }
            });
            
            // Обработчик изменения заголовка
            const titleInput = sectionDiv.querySelector('.section-title-input');
            titleInput.addEventListener('input', function() {
                const sectionId = this.getAttribute('data-id');
                const section = imageSections.find(s => s.id === sectionId);
                if (section) {
                    section.title = this.value;
                    updateCard();
                }
            });
        });
    }

    // Инициализация сортировки
    function initSortable() {
        const container = document.getElementById('sortableContainer');
        
        container.addEventListener('dragstart', function(e) {
            if (e.target.classList.contains('sortable-item') || e.target.closest('.sortable-item')) {
                dragSrcElement = e.target.classList.contains('sortable-item') ? e.target : e.target.closest('.sortable-item');
                dragSrcElement.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            }
        });
        
        container.addEventListener('dragover', function(e) {
            e.preventDefault();
            return false;
        });
        
        container.addEventListener('dragenter', function(e) {
            e.preventDefault();
        });
        
        container.addEventListener('drop', function(e) {
            e.preventDefault();
            if (dragSrcElement) {
                dragSrcElement.classList.remove('dragging');
                
                const rect = container.getBoundingClientRect();
                const y = e.clientY - rect.top;
                
                // Находим элемент над которым произошёл дроп
                const elements = Array.from(container.children);
                let insertBeforeElement = null;
                
                for (let element of elements) {
                    const rect = element.getBoundingClientRect();
                    const elementY = rect.top - container.getBoundingClientRect().top + rect.height / 2;
                    
                    if (y < elementY) {
                        insertBeforeElement = element;
                        break;
                    }
                }
                
                if (insertBeforeElement) {
                    container.insertBefore(dragSrcElement, insertBeforeElement);
                } else {
                    container.appendChild(dragSrcElement);
                }
                
                dragSrcElement = null;
            }
            return false;
        });
        
        container.addEventListener('dragend', function(e) {
            if (dragSrcElement) {
                dragSrcElement.classList.remove('dragging');
                dragSrcElement = null;
            }
        });
    }

    // Обновление карточки
    function updateCard() {
        const sortableContainer = document.getElementById('sortableContainer');
        const imageContainer = sortableContainer.querySelector('#dynamicImages') || document.createElement('div');
        imageContainer.id = 'dynamicImages';
        
        // Очищаем только динамические изображения
        const existingDynamic = sortableContainer.querySelector('#dynamicImages');
        if (existingDynamic) {
            existingDynamic.remove();
        }
        
        // Добавляем изображения в сортируемый контейнер
        if (imageSections.length > 0) {
            imageSections.forEach(section => {
                const imageDiv = document.createElement('div');
                imageDiv.className = 'sortable-item';
                imageDiv.setAttribute('draggable', 'true');
                imageDiv.innerHTML = `
                    ${section.image ? `<img src="${section.image}" class="card-image" alt="Изображение">` : ''}
                    ${section.title ? `<div class="image-title">${section.title}</div>` : ''}
                `;
                imageContainer.appendChild(imageDiv);
            });
            
            // Вставляем контейнер с изображениями в сортируемый контейнер
            const mainTitle = sortableContainer.querySelector('[data-type="main-title"]');
            if (mainTitle.nextSibling) {
                sortableContainer.insertBefore(imageContainer, mainTitle.nextSibling);
            } else {
                sortableContainer.appendChild(imageContainer);
            }
        }
    }

    function applyChanges() {
        document.getElementById('logoView').textContent = document.getElementById('logoInput').value || 'фултьма';
        document.getElementById('dateView').textContent = document.getElementById('dateInput').value || updateDate();
        document.getElementById('titleView').textContent = document.getElementById('titleInput').value || 'Заголовок';
        document.getElementById('subtitleView').textContent = document.getElementById('subtitleInput').value || '';
        
        const raw = document.getElementById('contentInput').value.trim();
        const paragraphs = raw.split(/\n{2,}/).map(p => `<p>${p}</p>`).join('');
        document.getElementById('contentView').innerHTML = paragraphs || '<p>Текст отсутствует.</p>';
        
        updateCard();
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
        const card = document.querySelector('.card');

        const container = document.createElement('div');
        container.style.width = card.offsetWidth + 'px';
        container.style.height = card.offsetHeight + 'px';
        container.style.position = 'fixed';
        container.style.top = '0';
        container.style.left = '0';
        container.style.opacity = '0';

        container.style.background = getComputedStyle(document.body).background;

        document.body.appendChild(container);

        const clone = card.cloneNode(true);
        clone.style.margin = '0';
        container.appendChild(clone);

        html2canvas(container, { scale: 2 }).then(canvas => {
            canvas.toBlob(blob => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'fulthma_card.jpg';
                link.click();
                URL.revokeObjectURL(link.href);
                document.body.removeChild(container);
            }, 'image/jpeg', 0.95);
        });
    });
  </script>
</body>
</html>
