<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФУЛТЬМА</title>
<style>
  /* Базовые стили */
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Хедер */
  header {
    padding: 20px;
    text-align: center;
    font-size: 1.8rem;
    font-weight: bold;
    backdrop-filter: blur(10px);
    background: rgba(30,30,30,0.5);
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* Лента */
  .feed {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* Карточки */
  .card {
    background: rgba(50,50,50,0.4);
    backdrop-filter: blur(15px);
    border-radius: 15px;
    padding: 15px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  .card.mini {
    cursor: default;
  }

  .card h3 {
    margin: 0 0 10px;
    font-size: 1.2rem;
  }

  .card p {
    margin: 0;
    font-size: 0.95rem;
    color: #ccc;
  }

  /* Открытый пост */
  .modal {
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height:100%;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s;
    z-index: 10;
  }

  .modal.active {
    opacity: 1;
    visibility: visible;
  }

  .modal-content {
    background: rgba(50,50,50,0.7);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 30px;
    max-width: 500px;
    width: 100%;
    color: #fff;
    position: relative;
  }

  .modal-content h3 {
    margin-top:0;
  }

  .close-btn {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 1.5rem;
    cursor: pointer;
    color: #fff;
  }

  /* Навигация (остров) */
  nav {
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    backdrop-filter: blur(15px);
    background: rgba(30,30,30,0.5);
    box-shadow: 0 -2px 5px rgba(0,0,0,0.5);
    position: fixed;
    bottom: 0;
    width: 100%;
  }

  nav button {
    background: none;
    border: none;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    padding: 10px 15px;
    transition: color 0.2s;
  }

  nav button.active {
    color: #00bfff;
  }
</style>
</head>
<body>

<header>ФУЛТЬМА</header>

<div class="feed" id="feed">
  <!-- Посты и мнения добавим скриптом -->
</div>

<nav>
  <button class="active">Лента</button>
  <button>Создать</button>
  <button>Настройки</button>
</nav>

<!-- Модалка для поста -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModal">&times;</span>
    <h3 id="modalTitle">Заголовок поста</h3>
    <p id="modalText">Текст поста...</p>
  </div>
</div>

<script>
const feed = document.getElementById('feed');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const closeModal = document.getElementById('closeModal');

const posts = [
  {type:'post', title:'Новый тренд в музыке', text:'Сегодня разбираем эффект Моргенштерна и влияние мемов на музыку...'},
  {type:'opinion', title:'Короткое мнение', text:'Сэмплирование это больше чем просто заимствование.'},
  {type:'post', title:'Секрет популярности трека', text:'Что делает трек вирусным и почему одни песни выстреливают, а другие нет...'},
  {type:'opinion', title:'Ещё мнение', text:'Музыка без визуала — как хлеб без масла.'}
];

posts.forEach(post => {
  const card = document.createElement('div');
  card.className = 'card' + (post.type === 'opinion' ? ' mini' : '');
  card.innerHTML = `<h3>${post.title}</h3>${post.type==='post'?'<p>'+post.text.slice(0,60)+'...</p>':''}`;
  
  if(post.type==='post'){
    card.addEventListener('click', () => {
      modalTitle.textContent = post.title;
      modalText.textContent = post.text;
      modal.classList.add('active');
    });
  }
  
  feed.appendChild(card);
});

closeModal.addEventListener('click', () => {
  modal.classList.remove('active');
});

// Закрытие по клику вне модалки
modal.addEventListener('click', (e)=>{
  if(e.target===modal) modal.classList.remove('active');
});
</script>

</body>
</html>
