<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фул.тьма - Новости</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .tagline {
            color: #8899a6;
            font-size: 16px;
        }

        .news-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 80px;
        }

        .news-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .news-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .news-category {
            display: inline-block;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .news-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .news-excerpt {
            color: #8899a6;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .news-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #667788;
        }

        .news-date {
            color: #ffa500;
        }

        /* Статья */
        .article {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .article-header {
            margin-bottom: 30px;
        }

        .article-back {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .article-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .article-meta {
            display: flex;
            gap: 15px;
            color: #8899a6;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .article-content {
            line-height: 1.8;
            font-size: 16px;
        }

        .article-content p {
            margin-bottom: 20px;
        }

        .article-image {
            width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }

        /* Кнопка выхода */
        .exit-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #8899a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">ФУЛ.ТЬМА</div>
            <div class="tagline">Там, где заканчивается свет</div>
        </div>

        <div class="news-grid" id="newsGrid">
            <div class="loading">Загружаем новости...</div>
        </div>
    </div>

    <!-- Контейнер для статей -->
    <div id="articleContainer"></div>

    <!-- Кнопка выхода -->
    <button class="exit-btn" onclick="closeApp()">Выйти из приложения</button>

    <script>
        // Данные новостей
        const newsData = [
            {
                id: 1,
                category: "ТЕХНОЛОГИИ",
                title: "Искусственный интеллект научился читать мысли",
                excerpt: "Новая нейросеть может воссоздавать изображения прямо из мозговой активности человека...",
                date: "15 дек 2024",
                image: "https://images.unsplash.com/photo-1620712943543-bcc4688e7485?w=400",
                content: `
                    <p>Ученые из Стэнфордского университета представили революционную технологию, позволяющую искусственному интеллекту визуализировать мысли человека. Система анализирует сигналы мозга и преобразует их в изображения с поразительной точностью.</p>
                    
                    <p>В ходе экспериментов добровольцам показывали различные изображения, а ИИ в реальном времени воссоздавал их на основе данных фМРТ. Результаты превзошли все ожидания — система смогла генерировать узнаваемые образы с точностью до 85%.</p>
                    
                    <p>"Это открывает новые горизонты для коммуникации с людьми, потерявшими способность говорить, и может изменить подход к лечению неврологических заболеваний", — заявил руководитель исследования доктор Майкл Чен.</p>
                `
            },
            {
                id: 2,
                category: "КУЛЬТУРА",
                title: "В Москве открылась выставка забытых художников авангарда",
                excerpt: "Более 200 работ неизвестных гениев русского авангарда впервые представлены публике...",
                date: "14 дек 2024",
                image: "https://images.unsplash.com/photo-1541961017774-22349e4a1262?w=400",
                content: `
                    <p>В Государственной Третьяковской галерее начала работу уникальная выставка "Забытые гении авангарда", на которой представлены работы художников, чьи имена были незаслуженно забыты историей.</p>
                    
                    <p>Экспозиция включает более 200 произведений из частных коллекций и музейных запасников. Среди них — картины учеников Малевича и Кандинского, которые долгие годы хранились в архивах.</p>
                    
                    <p>"Мы хотим восстановить историческую справедливость и показать, что русский авангард — это не только известные имена, но и десятки талантливых художников, внесших свой вклад в развитие искусства", — отметила куратор выставки Анна Петрова.</p>
                `
            },
            {
                id: 3,
                category: "НАУКА",
                title: "Обнаружена новая форма материи в глубинах космоса",
                excerpt: "Астрофизики зафиксировали странные сигналы, указывающие на существование неизвестной ранее материи...",
                date: "13 дек 2024",
                image: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=400",
                content: `
                    <p>Международная группа астрофизиков объявила об открытии, которое может перевернуть наши представления о Вселенной. Анализируя данные с телескопа "Хаббл", ученые обнаружили аномалии, указывающие на существование ранее неизвестной формы материи.</p>
                    
                    <p>Новая материя, получившая временное название "ксено-материя", проявляет свойства, не соответствующие ни одному из известных состояний вещества. Она не взаимодействует с электромагнитным излучением, но оказывает гравитационное воздействие на окружающие объекты.</p>
                    
                    <p>"Это открытие ставит под сомнение Стандартную модель физики и открывает новые направления для исследований", — говорит профессор Мартин Шмидт из Кембриджского университета.</p>
                `
            },
            {
                id: 4,
                category: "ОБЩЕСТВО",
                title: "Города будущего: как изменится жизнь мегаполисов через 10 лет",
                excerpt: "Умные города, вертикальные фермы и беспилотный транспорт — что ждет жителей крупных городов...",
                date: "12 дек 2024",
                image: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400",
                content: `
                    <p>Эксперты в области урбанистики представили прогноз развития крупных городов на ближайшее десятилетие. Согласно их исследованиям, уже к 2035 году жизнь в мегаполисах кардинально изменится.</p>
                    
                    <p>Основные тенденции включают повсеместное внедрение интернета вещей, создание вертикальных ферм для обеспечения продовольственной безопасности, переход на беспилотный общественный транспорт и развитие систем переработки отходов с замкнутым циклом.</p>
                    
                    <p>"Города будущего станут не просто умными, а адаптивными — они будут подстраиваться под потребности каждого жителя", — утверждает урбанист Джейн Доу.</p>
                `
            }
        ];

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Загрузка новостей
        function loadNews() {
            const newsGrid = document.getElementById('newsGrid');
            newsGrid.innerHTML = '';

            newsData.forEach(news => {
                const newsCard = document.createElement('div');
                newsCard.className = 'news-card';
                newsCard.onclick = () => openArticle(news);
                
                newsCard.innerHTML = `
                    <div class="news-category">${news.category}</div>
                    <div class="news-title">${news.title}</div>
                    <div class="news-excerpt">${news.excerpt}</div>
                    <div class="news-meta">
                        <span class="news-date">${news.date}</span>
                        <span>Читать →</span>
                    </div>
                `;
                
                newsGrid.appendChild(newsCard);
            });
        }

        // Открытие статьи
        function openArticle(news) {
            const articleContainer = document.getElementById('articleContainer');
            
            articleContainer.innerHTML = `
                <div class="article" style="display: block;">
                    <div class="article-header">
                        <button class="article-back" onclick="closeArticle()">
                            ← Назад
                        </button>
                        <div class="news-category">${news.category}</div>
                        <h1 class="article-title">${news.title}</h1>
                        <div class="article-meta">
                            <span>${news.date}</span>
                            <span>Фул.тьма</span>
                        </div>
                    </div>
                    <div class="article-content">
                        <img src="${news.image}" alt="${news.title}" class="article-image">
                        ${news.content}
                    </div>
                </div>
            `;
        }

        // Закрытие статьи
        function closeArticle() {
            const articleContainer = document.getElementById('articleContainer');
            articleContainer.innerHTML = '';
        }

        // Выход из приложения
        function closeApp() {
            tg.close();
        }

        // Загружаем новости при старте
        loadNews();
    </script>
</body>
</html>
