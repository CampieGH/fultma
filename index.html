<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canvas: карточка с кругами</title>

  <!-- Шрифты (подгружаем, чтобы текст выглядел аккуратно) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Rubik+Iso&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root{--w:1080;--h:1920}
    html,body{
      height:100%;
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#07080b;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      color:#fff;
    }
    .wrap{
      width:360px; /* просто превью в браузере */
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      border-radius:20px;
      overflow:hidden;
      background:#000;
    }
    canvas{display:block; width:100%; height:auto; background:transparent;}
    .controls{
      display:flex;
      gap:8px;
      padding:12px;
      justify-content:center;
      background:#0f1113;
    }
    button{
      padding:10px 14px;
      border-radius:10px;
      border:none;
      background:#ffffff12;
      color:#fff;
      cursor:pointer;
      font-weight:600;
    }
    button:active{transform:translateY(1px)}
    .note{font-size:12px;color:#a9aeb8;text-align:center;padding:10px 12px;}
  </style>
</head>
<body>

  <div class="wrap">
    <canvas id="cardCanvas" width="540" height="960"></canvas>
    <div class="controls">
      <button id="downloadBtn">Скачать PNG</button>
      <button id="openBtn">Открыть (iPhone → удержать → Сохранить)</button>
    </div>
    <div class="note">Размер превью 540×960. Скачивается 1080×1920 PNG (retina).</div>
  </div>

<script>
(async function(){
  // Параметры итогового изображения (фулл размер для скачивания)
  const OUT_W = 1080;   // итоговая ширина PNG
  const OUT_H = 1920;   // итоговая высота PNG
  // Логический canvas (превью) — совпадает с исходником в разметке
  const previewCanvas = document.getElementById('cardCanvas');
  const previewW = previewCanvas.width;   // 540
  const previewH = previewCanvas.height;  // 960

  // Функция рисования на произвольном контексте/размере
  function draw(ctx, W, H){
    // --- фон: линейный + несколько радиальных "белых кружков" ---
    // базовый градиент
    const base = ctx.createLinearGradient(0,0,0,H);
    base.addColorStop(0, '#0b0c10');
    base.addColorStop(1, '#07080b');
    ctx.fillStyle = base;
    ctx.fillRect(0,0,W,H);

    // helper для белых кругов (радиальных градиентов)
    function addCircle(cx, cy, r, innerAlpha){
      const g = ctx.createRadialGradient(cx, cy, r*0.1, cx, cy, r);
      g.addColorStop(0, `rgba(255,255,255,${innerAlpha})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // масштабируем радиусы в зависимости от размера
    const short = Math.min(W,H);
    addCircle(W*0.5, H*0.05, short*0.37, 0.14); // верхняя большая
    addCircle(W*0.2, H*0.28, short*0.28, 0.12);
    addCircle(W*0.8, H*0.2, short*0.22, 0.10);
    addCircle(W*0.5, H*0.62, short*0.40, 0.14);
    // дополнительный слабый свет
    addCircle(W*0.75, H*0.75, short*0.18, 0.09);

    // --- карточка с очень закруглёнными углами ---
    const cardW = Math.round(W * 0.5 * 1.0 + 0); // на превью размер будет помещён автоматически
    const cardH = Math.round(H * 0.5 * 1.0 + 0);
    // позиция (центр)
    const cx = W/2;
    const cy = H/2;
    const x = cx - cardW/2;
    const y = cy - cardH/2;

    // draw shadow by drawing a rounded rect on a separate temporary canvas with blur effect
    // simpler: use ctx.shadow* on fill
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = Math.round(Math.max(W,H) * 0.03);
    ctx.shadowOffsetY = Math.round(Math.max(W,H) * 0.01);

    // card background (semi-transparent + blur effect imitation)
    const cardRadius = Math.min(cardW, cardH) * 0.06; // strong rounding
    // rounded rect path
    roundRectPath(ctx, x, y, cardW, cardH, cardRadius);
    ctx.fillStyle = 'rgba(12,13,18,0.88)';
    ctx.fill();
    ctx.restore();

    // inner stroke / glass edge
    ctx.save();
    roundRectPath(ctx, x+1, y+1, cardW-2, cardH-2, cardRadius);
    ctx.lineWidth = Math.max(1, Math.round(W*0.0025));
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.stroke();
    ctx.restore();

    // subtle inner highlight (top)
    ctx.save();
    roundRectPath(ctx, x+1, y+1, cardW-2, cardH/2, cardRadius, true);
    ctx.fillStyle = 'rgba(255,255,255,0.015)';
    ctx.fill();
    ctx.restore();

    // clip to card and draw some placeholder content (можешь убрать)
    ctx.save();
    roundRectPath(ctx, x, y, cardW, cardH, cardRadius);
    ctx.clip();

    // Пример контента внутри карточки: логотип, дата, заголовок, абзацы
    const padding = Math.round(cardW * 0.09);
    const innerX = x + padding;
    let curY = y + padding;

    // логотип (text)
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.round(cardW*0.08)}px Rubik Iso, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('фултьма', cx, curY + Math.round(cardW*0.04));
    curY += Math.round(cardW*0.08) + padding*0.4;

    // дата
    ctx.fillStyle = 'rgba(169,176,190,0.9)';
    ctx.font = `${Math.round(cardW*0.035)}px Inter, Roboto, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('15 ноября 2025', cx, curY + Math.round(cardW*0.02));
    curY += Math.round(cardW*0.05) + padding*0.2;

    // заголовок
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = `700 ${Math.round(cardW*0.12)}px Inter, Roboto, sans-serif`;
    ctx.fillText('Идейные выводы', cx, curY + Math.round(cardW*0.06));
    curY += Math.round(cardW*0.12) + padding*0.2;

    // подзаголовок
    ctx.fillStyle = 'rgba(169,176,190,0.9)';
    ctx.font = `${Math.round(cardW*0.055)}px Inter, Roboto, sans-serif`;
    ctx.fillText('Банальные, но непровержимые', cx, curY + Math.round(cardW*0.03));
    curY += Math.round(cardW*0.06) + padding*0.4;

    // тело: два параграфа в несколько строк
    ctx.fillStyle = 'rgba(245,247,250,0.95)';
    ctx.font = `${Math.round(cardW*0.06)}px Roboto, Inter, sans-serif`;
    ctx.textAlign = 'left';
    const bodyW = cardW - padding*2;
    const px = innerX;
    let textY = y + cardH*0.48;

    const paragraph1 = 'Банальные, но неопровержимые выводы, а также явные признаки подмены институциональности и по сей день остаются уделом либералов.';
    const paragraph2 = 'Идейные сообщения высшего порядка, а также граница обучения кадров прекрасно подходят для реализации своевременного выполнения сверхзадач.';

    textY = drawWrappedText(ctx, paragraph1, px, textY, bodyW, Math.round(cardW*0.055), 1.45);
    textY += Math.round(cardW*0.03); // gap
    textY = drawWrappedText(ctx, paragraph2, px, textY, bodyW, Math.round(cardW*0.055), 1.45);

    ctx.restore(); // снимаем clip
  }

  // === вспомогательные функции ===
  function roundRectPath(ctx, x, y, w, h, r, topOnly=false){
    // r — радиус
    if (topOnly) {
      // path for top half rounded (used для highlight)
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawWrappedText(ctx, text, x, y, maxWidth, fontSize, lineHeightFactor){
    // нарезаем на слова и рендерим построчно
    ctx.font = `${fontSize}px Roboto, Inter, sans-serif`;
    const words = text.split(' ');
    let line = '';
    const lh = fontSize * lineHeightFactor;
    for (let n = 0; n < words.length; n++) {
      const testLine = line + (line ? ' ' : '') + words[n];
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n];
        y += lh;
      } else {
        line = testLine;
      }
    }
    if (line) {
      ctx.fillText(line, x, y);
      y += lh;
    }
    return y;
  }

  // --- отрисовка превью (маленький canvas) ---
  // ждём, пока шрифты загрузятся
  await document.fonts.ready;

  // Preview canvas — использован для отображения в элементе <canvas id="cardCanvas">
  const previewCtx = previewCanvas.getContext('2d');
  draw(previewCtx, previewCanvas.width, previewCanvas.height);

  // функция, делающая финал (большой canvas) и отдающая dataURL
  function makeExportDataURL() {
    // создаём оффскрин canvas нужного размера
    const canvas = document.createElement('canvas');
    canvas.width = OUT_W;
    canvas.height = OUT_H;
    const ctx = canvas.getContext('2d');

    // рисуем фон белых кружков и карточки на большем canvas
    draw(ctx, canvas.width, canvas.height);

    // возвращаем PNG data URL
    return canvas.toDataURL('image/png');
  }

  // кнопки
  const downloadBtn = document.getElementById('downloadBtn');
  const openBtn = document.getElementById('openBtn');

  downloadBtn.addEventListener('click', () => {
    try {
      const dataURL = makeExportDataURL();
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = 'fulthma_card.png';
      // iOS иногда игнорирует programmatic click for download — но обычно работает в десктоп/андроид.
      a.click();
      // fallback: открываем в новой вкладке, если автоматический DL не сработал
      setTimeout(()=> window.open(dataURL, '_blank'), 200);
    } catch (err) {
      console.error(err);
      alert('Ошибка при генерации изображения — см. консоль.');
    }
  });

  openBtn.addEventListener('click', () => {
    const dataURL = makeExportDataURL();
    // откроется в новой вкладке — на iPhone long-press по картинке даст "Сохранить"
    window.open(dataURL, '_blank');
  });

})(); // IIFE
</script>
</body>
</html>
