<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портал в блочный мир</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#2a2733,#0d0c12);font-family:system-ui,-apple-system,sans-serif;color:#eee}
  canvas{display:block}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:22px 18px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.75));pointer-events:none}
  #ui>*{pointer-events:auto}
  h1{margin:0;font-size:22px;letter-spacing:.4px}
  p{margin:0;opacity:.82;max-width:540px;font-size:14px;line-height:1.45}
  button{font-size:18px;padding:14px 30px;border-radius:14px;border:0;background:#2fd3c8;color:#062b2a;font-weight:700;cursor:pointer}
  button:disabled{background:#4a4a52;color:#aaa;cursor:default}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <h1>Портал в блочный мир</h1>
  <p id="hint">Проверяю WebXR…</p>
  <button id="go" disabled>…</button>
</div>

<script type="module">
import * as THREE from 'three';

// ───────────── параметры ─────────────
const BS = 0.5;            // размер блока мира, м
const F  = 0.15;           // размер блока рамки, м
const W  = F * 8;          // ширина проёма (1.2 м)
const H  = F * 13;         // высота проёма (1.95 м)
const T  = 0.35;           // «толщина стены» — глубина туннеля
const WATER = -1;          // уровень воды (в блоках)

// ───────────── рендер ─────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe6ff, 7, 21);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 120);
camera.position.set(0, 1.5, 1.3);

scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6a40, 1.3));
const sunLight = new THREE.DirectionalLight(0xfff2dd, 1.8);
sunLight.position.set(4, 10, 6);
scene.add(sunLight);

// ───────────── стенсил: мир виден только сквозь проём ─────────────
function inPortal(m) {
  m.stencilWrite = true; m.stencilRef = 1;
  m.stencilFunc = THREE.EqualStencilFunc;
  m.stencilFail = m.stencilZFail = m.stencilZPass = THREE.KeepStencilOp;
  return m;
}
function outsidePortal(m) {
  inPortal(m); m.stencilFunc = THREE.NotEqualStencilFunc; return m;
}

// ───────────── пиксельные текстуры (рисуются кодом) ─────────────
const pick = a => a[Math.random() * a.length | 0];
function canvas16(draw) { const c = document.createElement('canvas'); c.width = c.height = 16; draw(c.getContext('2d')); return c; }
function tex(c, repeat) {
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapLinearFilter;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function speckle(g, pal) { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = pick(pal); g.fillRect(x, y, 1, 1); } }
const P = {
  grass: ['#5d9e3a', '#6aae40', '#4f8c30', '#78b848'],
  dirt:  ['#7a5534', '#8a603b', '#6b482b', '#946b44'],
  stone: ['#7d7d7d', '#8a8a8a', '#6e6e6e', '#959595'],
  sand:  ['#dccf96', '#e6d9a2', '#cfc088', '#efe3b0'],
  snow:  ['#f4f8ff', '#e8eef8', '#ffffff', '#dde6f2'],
  bark:  ['#6b4f2e', '#5a4226', '#7a5a35'],
  leaf:  ['#3c7a28', '#2f6a20', '#4a8c32', '#24561a'],
  water: ['#3a6fd8', '#3366cc', '#4479e0', '#2e5fc0'],
  dark:  ['#1c1a24', '#24212e', '#15131b', '#201d29'],
};
const cracks = [];
for (let n = 0; n < 4; n++) {
  let x = Math.random() * 16 | 0, y = Math.random() * 16 | 0;
  for (let s = 0; s < 7; s++) { cracks.push([x, y]); x = (x + (Math.random() * 3 | 0) + 15) % 16; y = (y + (Math.random() * 3 | 0) + 15) % 16; }
}
const tx = {
  grassTop:  tex(canvas16(g => speckle(g, P.grass))),
  grassSide: tex(canvas16(g => { speckle(g, P.dirt); for (let x = 0; x < 16; x++) { const d = 3 + (Math.random() * 3 | 0); for (let y = 0; y < d; y++) { g.fillStyle = pick(P.grass); g.fillRect(x, y, 1, 1); } } })),
  dirt:      tex(canvas16(g => speckle(g, P.dirt))),
  stone:     tex(canvas16(g => speckle(g, P.stone))),
  sand:      tex(canvas16(g => speckle(g, P.sand))),
  snow:      tex(canvas16(g => speckle(g, P.snow))),
  leaves:    tex(canvas16(g => speckle(g, P.leaf))),
  water:     tex(canvas16(g => speckle(g, P.water)), true),
  logSide:   tex(canvas16(g => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = x % 4 === 0 ? '#4b3720' : pick(P.bark); g.fillRect(x, y, 1, 1); } })),
  logTop:    tex(canvas16(g => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const d = Math.max(Math.abs(x - 7.5), Math.abs(y - 7.5)); g.fillStyle = d > 6.5 ? pick(P.bark) : (Math.floor(d) % 2 ? '#a07a48' : '#b98f58'); g.fillRect(x, y, 1, 1); } })),
  frame:     tex(canvas16(g => { speckle(g, P.dark); g.fillStyle = '#3fb8b0'; cracks.forEach(([x, y]) => g.fillRect(x, y, 1, 1)); })),
  frameGlow: tex(canvas16(g => { g.fillStyle = '#000'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#fff'; cracks.forEach(([x, y]) => g.fillRect(x, y, 1, 1)); })),
};

const lam = (map, extra = {}) => inPortal(new THREE.MeshLambertMaterial({ map, ...extra }));
const gSide = lam(tx.grassSide), gTop = lam(tx.grassTop), mDirt = lam(tx.dirt);
const lSide = lam(tx.logSide), lTop = lam(tx.logTop);
const M = {
  grass:  [gSide, gSide, gTop, mDirt, gSide, gSide],
  dirt:   mDirt,
  stone:  lam(tx.stone),
  sand:   lam(tx.sand),
  snow:   lam(tx.snow),
  log:    [lSide, lSide, lTop, lTop, lSide, lSide],
  leaves: lam(tx.leaves),
  water:  lam(tx.water, { transparent: true, opacity: 0.78, depthWrite: false }),
};

// ───────────── генерация мира ─────────────
const SEED = (Math.random() * 1e6) | 0;
function hash(x, z) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(z | 0, 668265263) ^ Math.imul(SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  const a = hash(xi, zi), b = hash(xi + 1, zi), c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.1 + 17, z * 2.1 + 5) * 0.3 + vnoise(x * 4.3 + 3, z * 4.3 + 11) * 0.15;

const NX = 20, NZ = 40;
const hm = new Map(); const key = (i, k) => i + ',' + k;
for (let i = -NX; i <= NX; i++) for (let k = 0; k < NZ; k++) {
  let h = (fbm(i * 0.08 + 50, k * 0.08 + 50) - 0.5) * 14;
  h += Math.max(0, k - 24) * 0.6;                                   // горы на горизонте
  const t = Math.min(1, Math.max(0, Math.max(k - 4, Math.abs(i) - 3) / 7)); // ровная площадка у входа
  hm.set(key(i, k), Math.round(h * t));
}
const getH = (i, k) => hm.get(key(i, k));

const lists = { grass: [], dirt: [], stone: [], sand: [], snow: [], log: [], leaves: [], water: [] };
const add = (type, i, L, k) => lists[type].push(i * BS, (L - 0.5) * BS, -(k + 0.5) * BS);
const leafSet = new Set();

for (let i = -NX; i <= NX; i++) for (let k = 0; k < NZ; k++) {
  const h = getH(i, k);
  let minN = Infinity;
  for (const [di, dk] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const n = getH(i + di, k + dk); minN = Math.min(minN, n === undefined ? h - 5 : n); }
  const beach = h <= WATER;
  for (let L = Math.min(h, minN + 1); L <= h; L++) {
    let type;
    if (L === h) type = beach ? 'sand' : h >= 9 ? 'snow' : h >= 6 ? 'stone' : 'grass';
    else if (L >= h - 2) type = beach ? 'sand' : 'dirt';
    else type = 'stone';
    add(type, i, L, k);
  }
  if (h < WATER) add('water', i, WATER, k);

  // деревья
  if (!beach && h >= 0 && h < 6 && k > 7 && (Math.abs(i) > 2 || k > 12) && hash(i + 101, k + 57) < 0.045) {
    const th = 4 + (hash(i, k + 9) * 2 | 0);
    for (let L = h + 1; L <= h + th; L++) add('log', i, L, k);
    for (let L = h + th - 1; L <= h + th + 1; L++) {
      const r = L > h + th ? 1 : 2;
      for (let di = -r; di <= r; di++) for (let dk = -r; dk <= r; dk++) {
        if (di === 0 && dk === 0 && L <= h + th) continue;
        if (Math.abs(di) === r && Math.abs(dk) === r && hash(i + di + L * 31, k + dk) < 0.6) continue;
        const nh = getH(i + di, k + dk); if (nh === undefined || nh >= L) continue;
        const kk = key(i + di, k + dk) + ',' + L; if (leafSet.has(kk)) continue; leafSet.add(kk);
        add('leaves', i + di, L, k + dk);
      }
    }
  }
}

// ───────────── сборка портала ─────────────
const portal = new THREE.Group();
scene.add(portal);

// маска проёма: пишет 1 в стенсил, сама невидима
const maskMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: false });
maskMat.stencilWrite = true; maskMat.stencilRef = 1;
maskMat.stencilFunc = THREE.AlwaysStencilFunc; maskMat.stencilZPass = THREE.ReplaceStencilOp;
const mask = new THREE.Mesh(new THREE.PlaneGeometry(W, H), maskMat);
mask.renderOrder = -1;
portal.add(mask);

// мир за стеной
const world = new THREE.Group();
world.position.set(0, -H / 2, -T);   // уровень травы = реальный пол
portal.add(world);

const box = new THREE.BoxGeometry(BS, BS, BS);
const waterBox = new THREE.BoxGeometry(BS, BS * 0.88, BS).translate(0, -BS * 0.06, 0);
const m4 = new THREE.Matrix4();
for (const [type, arr] of Object.entries(lists)) {
  const n = arr.length / 3; if (!n) continue;
  const im = new THREE.InstancedMesh(type === 'water' ? waterBox : box, M[type], n);
  for (let j = 0; j < n; j++) { m4.makeTranslation(arr[3 * j], arr[3 * j + 1], arr[3 * j + 2]); im.setMatrixAt(j, m4); }
  im.renderOrder = type === 'water' ? 3 : 2;
  im.frustumCulled = false;
  world.add(im);
}

// небо, солнце, облака
const skyC = document.createElement('canvas'); skyC.width = 2; skyC.height = 256;
{ const g = skyC.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#2f6fd6'); gr.addColorStop(0.42, '#8cc4ff'); gr.addColorStop(0.5, '#cfe6ff'); gr.addColorStop(1, '#cfe6ff');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256); }
const skyTex = new THREE.CanvasTexture(skyC); skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.SphereGeometry(45, 32, 16),
  inPortal(new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false })));
sky.renderOrder = 1; world.add(sky);

const sun = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), inPortal(new THREE.MeshBasicMaterial({ color: 0xfff6c0, fog: false })));
sun.position.set(9, 17, -36); sun.lookAt(0, 1, 0); sun.renderOrder = 1; world.add(sun);

const cloudMat = inPortal(new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x888888, transparent: true, opacity: 0.92, fog: false }));
const clouds = [];
for (let c = 0; c < 14; c++) {
  const cl = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), cloudMat);
  cl.scale.set(2 + Math.random() * 4, 0.45, 1.2 + Math.random() * 2.5);
  cl.position.set((Math.random() - 0.5) * 36, 8 + Math.random() * 1.5, -3 - Math.random() * 28);
  cl.userData.v = 0.25 + Math.random() * 0.3;
  cl.renderOrder = 3; world.add(cl); clouds.push(cl);
}

// туннель — толщина «стены»
const tunnelMat = inPortal(new THREE.MeshLambertMaterial({ color: 0x2a2833, emissive: 0x2fd3c8, emissiveIntensity: 0.1 }));
for (const [w, h, x, y] of [[0.1, H + 0.2, -W / 2 - 0.05, 0], [0.1, H + 0.2, W / 2 + 0.05, 0], [W + 0.2, 0.1, 0, H / 2 + 0.05], [W + 0.2, 0.1, 0, -H / 2 - 0.05]]) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, T), tunnelMat);
  m.position.set(x, y, -T / 2); m.renderOrder = 2; portal.add(m);
}

// рамка из светящихся блоков (видна в реальной комнате)
const framePos = [];
const cols = Math.round(H / F) + 1;
for (let j = 0; j < cols; j++) framePos.push([-W / 2 - F / 2, -H / 2 + F / 2 + j * F]);
for (let j = 0; j < Math.round(W / F); j++) framePos.push([-W / 2 + F / 2 + j * F, H / 2 + F / 2]);
for (let j = cols - 1; j >= 0; j--) framePos.push([W / 2 + F / 2, -H / 2 + F / 2 + j * F]);
const frameMat = new THREE.MeshLambertMaterial({ map: tx.frame, emissiveMap: tx.frameGlow, emissive: 0x2fd3c8, emissiveIntensity: 1, fog: false });
const frame = new THREE.InstancedMesh(new THREE.BoxGeometry(F, F, F), frameMat, framePos.length);
frame.frustumCulled = false;
portal.add(frame);

// искры вокруг рамки
const PN = 160;
const pPos = new Float32Array(PN * 3), pVel = new Float32Array(PN), pLife = new Float32Array(PN);
function spawn(j, anyAge) {
  const s = Math.random(); let x, y;
  if (s < 0.4) { x = -W / 2 - F / 2 + (Math.random() - 0.5) * 0.25; y = (Math.random() - 0.5) * H; }
  else if (s < 0.8) { x = W / 2 + F / 2 + (Math.random() - 0.5) * 0.25; y = (Math.random() - 0.5) * H; }
  else { x = (Math.random() - 0.5) * W; y = H / 2 + (Math.random() - 0.3) * 0.25; }
  pPos[3 * j] = x; pPos[3 * j + 1] = y; pPos[3 * j + 2] = Math.random() * 0.3;
  pVel[j] = 0.05 + Math.random() * 0.12; pLife[j] = anyAge ? Math.random() * 3 : 1.5 + Math.random() * 2;
}
for (let j = 0; j < PN; j++) spawn(j, true);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const dotC = document.createElement('canvas'); dotC.width = dotC.height = 32;
{ const g = dotC.getContext('2d'); const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); }
const sparks = new THREE.Points(pGeo, new THREE.PointsMaterial({ color: 0x6ff5ea, size: 0.03, map: new THREE.CanvasTexture(dotC), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
sparks.frustumCulled = false;
portal.add(sparks);

// превью-комната для ПК (в AR скрыта, там настоящая стена)
const preview = new THREE.Group();
const wall = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.2), outsidePortal(new THREE.MeshLambertMaterial({ color: 0xd9d3c9 })));
wall.position.set(0, -H / 2 + 1.6, 0); wall.renderOrder = 1; preview.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(7, 5), outsidePortal(new THREE.MeshLambertMaterial({ color: 0x8a6f55 })));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, -H / 2, 2.5); floor.renderOrder = 1; preview.add(floor);
portal.add(preview);

portal.position.set(0, H / 2, -1.5);

// ───────────── звук ─────────────
let actx, noiseBuf, windGain;
function initAudio() {
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 450;
  windGain = actx.createGain(); windGain.gain.value = 0;
  src.connect(lp).connect(windGain).connect(actx.destination); src.start();
}
function whoosh() {
  if (!actx) return;
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(150, t); bp.frequency.exponentialRampToValueAtTime(1800, t + 1.0);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  s.connect(bp).connect(g).connect(actx.destination); s.start(t); s.stop(t + 1.5);
  const o = actx.createOscillator(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.8);
  const og = actx.createGain(); og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 1);
}

// ───────────── открытие портала ─────────────
let openT = 0, whooshed = false;
function openPortal() { openT = 0; whooshed = false; }
const ease = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2); // easeOutBack
const clamp01 = x => Math.min(1, Math.max(0, x));
const vPos = new THREE.Vector3(), vScale = new THREE.Vector3(), qId = new THREE.Quaternion();

function animate(dt, t) {
  openT += dt;
  // 1) рамка собирается блок за блоком
  const fp = clamp01(openT / 0.9) * framePos.length;
  for (let j = 0; j < framePos.length; j++) {
    const s = Math.max(0.0001, ease(clamp01(fp - j)));
    vPos.set(framePos[j][0], framePos[j][1], F / 2); vScale.setScalar(s);
    frame.setMatrixAt(j, m4.compose(vPos, qId, vScale));
  }
  frame.instanceMatrix.needsUpdate = true;
  // 2) вспышка и раскрытие проёма
  if (openT > 0.9 && !whooshed) { whooshed = true; whoosh(); }
  const mp = Math.max(0.001, ease(clamp01((openT - 0.9) / 0.7)));
  mask.scale.set(mp, mp, 1);
  const flash = openT > 0.9 ? Math.max(0, 1 - (openT - 0.9) / 0.6) * 4 : 0;
  frameMat.emissiveIntensity = 0.7 + 0.3 * Math.sin(t * 2.2) + flash;
  tunnelMat.emissiveIntensity = 0.08 + 0.04 * Math.sin(t * 2.2) + flash * 0.2;
  sparks.visible = openT > 0.9;

  // жизнь мира
  for (const c of clouds) { c.position.x += c.userData.v * dt; if (c.position.x > 20) c.position.x = -20; }
  tx.water.offset.x = (t * 0.03) % 1; tx.water.offset.y = Math.sin(t * 0.5) * 0.05;
  for (let j = 0; j < PN; j++) {
    pPos[3 * j + 1] += pVel[j] * dt; pPos[3 * j] += Math.sin(t * 3 + j) * 0.01 * dt;
    pLife[j] -= dt; if (pLife[j] < 0) spawn(j, false);
  }
  pGeo.attributes.position.needsUpdate = true;

  // ветер из портала громче, когда подходишь
  if (windGain) {
    const cam = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
    const d = cam.getWorldPosition(vPos).distanceTo(portal.position);
    const target = portal.visible && openT > 1.2 ? 0.14 * clamp01(1 - (d - 0.4) / 3) : 0;
    windGain.gain.setTargetAtTime(target, actx.currentTime, 0.25);
  }
}

// ───────────── AR: прицел и установка на стену ─────────────
const inputs = new Map();
const reticleGeo = new THREE.RingGeometry(0.06, 0.08, 32).rotateX(-Math.PI / 2);
const reticleMat = new THREE.MeshBasicMaterial({ color: 0x6ff5ea, transparent: true, opacity: 0.85, fog: false });
function addSource(session, src) {
  const reticle = new THREE.Mesh(reticleGeo, reticleMat);
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);
  const entry = { hts: null, reticle, last: null };
  inputs.set(src, entry);
  if (session.requestHitTestSource) session.requestHitTestSource({ space: src.targetRaySpace }).then(h => entry.hts = h).catch(() => {});
}
function removeSource(src) {
  const e = inputs.get(src); if (!e) return;
  e.hts && e.hts.cancel(); scene.remove(e.reticle); inputs.delete(src);
}
function updateHits(frame) {
  const ref = renderer.xr.getReferenceSpace();
  for (const e of inputs.values()) {
    e.last = null; e.reticle.visible = false;
    if (!e.hts) continue;
    const r = frame.getHitTestResults(e.hts);
    const pose = r.length && r[0].getPose(ref);
    if (pose) { e.reticle.visible = true; e.reticle.matrix.fromArray(pose.transform.matrix); e.last = pose.transform; }
  }
}
function placeAt(p, n) {
  n = n.clone();
  if (Math.abs(n.y) > 0.6) {                // попали в пол/стол — ставим отдельно стоящую дверь лицом к тебе
    renderer.xr.getCamera().getWorldPosition(vPos);
    n.set(vPos.x - p.x, 0, vPos.z - p.z);
  } else n.y = 0;
  n.normalize();
  p.addScaledVector(n, 0.01);
  portal.position.set(p.x, H / 2, p.z);
  portal.rotation.set(0, Math.atan2(n.x, n.z), 0);
  portal.visible = true;
  openPortal();
}
function onSelect(ev) {
  const e = inputs.get(ev.inputSource);
  if (e && e.last) {
    const { position: p, orientation: o } = e.last;
    const n = new THREE.Vector3(0, 1, 0).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w));
    placeAt(new THREE.Vector3(p.x, p.y, p.z), n);
    return;
  }
  // без hit-test: ставим в 1.8 м по направлению луча
  const pose = ev.frame.getPose(ev.inputSource.targetRaySpace, renderer.xr.getReferenceSpace());
  if (!pose) return;
  const o = pose.transform.orientation, po = pose.transform.position;
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion(o.x, o.y, o.z, o.w)); dir.y = 0; dir.normalize();
  placeAt(new THREE.Vector3(po.x, 0, po.z).addScaledVector(dir, 1.8), dir.negate());
}

// ───────────── UI ─────────────
const ui = document.getElementById('ui'), hint = document.getElementById('hint'), btn = document.getElementById('go');
const desktopHint = 'Двигай мышью или пальцем, чтобы заглянуть внутрь. Клик — открыть заново.';
if (!navigator.xr) {
  hint.textContent = 'WebXR недоступен. Открой страницу в браузере Quest 3 по https. ' + desktopHint;
  btn.textContent = 'AR недоступен';
} else {
  navigator.xr.isSessionSupported('immersive-ar').then(ok => {
    if (ok) {
      btn.disabled = false; btn.textContent = 'Открыть портал';
      hint.textContent = 'Наведи луч контроллера или руки на стену и нажми курок или сведи пальцы. Нажми ещё раз — портал переедет.';
    } else {
      btn.textContent = 'AR недоступен';
      hint.textContent = 'Здесь нет AR. Открой в браузере Quest 3. ' + desktopHint;
    }
  });
}
btn.onclick = async () => {
  initAudio();
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hit-test', 'hand-tracking', 'plane-detection', 'mesh-detection'],
    });
    await renderer.xr.setSession(session);
    portal.visible = false; preview.visible = false; ui.style.display = 'none';
    for (const s of session.inputSources) addSource(session, s);
    session.addEventListener('inputsourceschange', e => { e.added.forEach(s => addSource(session, s)); e.removed.forEach(removeSource); });
    session.addEventListener('select', onSelect);
    session.addEventListener('end', () => {
      [...inputs.keys()].forEach(removeSource);
      ui.style.display = ''; preview.visible = true; portal.visible = true;
      portal.position.set(0, H / 2, -1.5); portal.rotation.set(0, 0, 0); openPortal();
    });
  } catch (err) { hint.textContent = 'Не удалось запустить AR: ' + err.message; }
};

// превью на ПК/телефоне
let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
renderer.domElement.addEventListener('click', () => { if (!renderer.xr.isPresenting) { initAudio(); openPortal(); } });
const camTarget = new THREE.Vector3();
function updateDesktopCam() {
  camera.position.lerp(camTarget.set(mx * 1.4, 1.5 - my * 0.6, 1.3), 0.08);
  camera.lookAt(0, 1.0, -1.5);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ───────────── цикл ─────────────
const clock = new THREE.Clock();
renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (frame) updateHits(frame);
  if (!renderer.xr.isPresenting) updateDesktopCam();
  animate(dt, t);
  renderer.render(scene, camera);
});
window.__ready = true;
</script>
</body>
</html>
