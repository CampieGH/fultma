<script>
function generateNewsCard({ title, description, image, link }) {
  return `
    <div style="
      width: 100%;
      max-width: 360px;
      background: #0E0E0E;
      border-radius: 18px;
      padding: 18px;
      color: white;
      font-family: Inter, sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      overflow: hidden;
    ">
      <div style="
        width: 100%;
        height: 180px;
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 14px;
      ">
        <img src="${image}" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <h2 style="
        font-size: 20px;
        margin: 0 0 8px 0;
        font-weight: 600;
      ">
        ${title}
      </h2>
      <p style="
        font-size: 14px;
        opacity: 0.7;
        margin: 0 0 16px 0;
        line-height: 1.4;
      ">
        ${description}
      </p>
      <a href="${link}" style="
        display: inline-block;
        padding: 10px 14px;
        background: #1A1A1A;
        border-radius: 12px;
        font-size: 14px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
      " onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        Читать
      </a>
    </div>
  `;
}

// ТЕСТ
document.body.innerHTML += generateNewsCard({
  title: "Твой стильный заголовок",
  description: "Описание новости. Коротко, ёмко, без воды.",
  image: "https://picsum.photos/700/400",
  link: "#"
});
</script>
