<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карточка новости</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    padding-top: 50px;
  }
  #card {
    width: 400px;
    padding: 20px;
    border-radius: 15px;
    background: linear-gradient(145deg, #ffffff, #e0e0e0);
    box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
    text-align: center;
    position: relative;
  }
  #logo {
    width: 60px;
    position: absolute;
    top: 20px;
    right: 20px;
  }
  #text {
    margin-top: 40px;
    font-size: 18px;
    line-height: 1.4;
    color: #333;
  }
  #downloadBtn {
    margin-top: 20px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background-color: #4caf50;
    color: white;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>
<div id="card">
  <img id="logo" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Telegram_2019_Logo.svg" alt="Logo">
  <div id="text" contenteditable="true">Напиши сюда текст новости...</div>
</div>
<button id="downloadBtn">Скачать JPG</button>

<script>
  const btn = document.getElementById('downloadBtn');
  btn.addEventListener('click', () => {
    const card = document.getElementById('card');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = 'news_card.jpg';
      link.href = canvas.toDataURL("image/jpeg");
      link.click();
    });
  });
</script>

<!-- Подключаем html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
