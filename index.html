<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Карточка — фултьма</title>

  <!-- Подключил Inter и Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Iso&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background:
        radial-gradient(400px 400px at 50% 5%, rgba(255,255,255,0.15), transparent),
        radial-gradient(400px 400px at 20% 30%, rgba(255,255,255,0.17), transparent),
        radial-gradient(300px 300px at 80% 20%, rgba(255,255,255,0.13), transparent),
        radial-gradient(500px 500px at 50% 60%, rgba(255,255,255,0.18), transparent),
        linear-gradient(180deg, #0b0c10 0%, #07080b 100%);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 540px;
      height: 960px;
      background: #0a0a0a;
      backdrop-filter: blur(2px);
      color: #f2f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 50px;
      box-sizing: border-box;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      margin-top: 80px;
    }

    .card-inner {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      font-family: 'Rubik Iso', sans-serif;
      font-size: 38px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 24px;
    }

    .date {
      font-size: 20px;
      color: #a9b0be;
      margin-bottom: 20px;
    }

    .title {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 22px;
      color: #a9b0be;
      margin-bottom: 24px;
    }

    .content {
      font-size: 24px;
      line-height: 1.5;
      font-family: 'Roboto', sans-serif;
    }

    .content p {
      margin-bottom: 24px;
    }

    .editor {
      width: min(540px, 92vw);
      background: #1a1c22;
      padding: 24px;
      border-radius: 16px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      margin-top: 120px;
      display: grid;
      gap: 14px;
    }

    .editor h3 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .editor input,
    .editor textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      background: #101217;
      color: #fff;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .editor button {
      padding: 10px 20px;
      background: #ffffff1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .editor button:hover {
      background: #ffffff2d;
    }

    #downloadBtn {
      margin: 40px auto;
      padding: 12px 24px;
      font-size: 16px;
      background: #ffffff1a;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-inner">
      <div class="logo" id="logoView">фултьма</div>
      <div class="date" id="dateView">дата</div>
      <h1 class="title" id="titleView">-</h1>
      <p class="subtitle" id="subtitleView">ТГК: ФУЛТЬМА</p>
      <div class="content" id="contentView">
        <p>-</p>
      </div>
    </div>
  </div>

  <div class="editor">
    <h3>Редактировать карточку</h3>
    <input type="text" id="logoInput" placeholder="Логотип" />
    <input type="text" id="dateInput" placeholder="Дата" />
    <input type="text" id="titleInput" placeholder="Заголовок" />
    <input type="text" id="subtitleInput" placeholder="Подзаголовок" />
    <textarea id="contentInput" placeholder="Текст (абзацы через пустую строку)"></textarea>
    <button onclick="applyChanges()">Применить</button>
  </div>

  <button id="downloadBtn">Скачать для TikTok</button>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    function applyChanges() {
      document.getElementById('logoView').textContent = document.getElementById('logoInput').value || 'фултьма';
      document.getElementById('dateView').textContent = document.getElementById('dateInput').value || 'Сегодня';
      document.getElementById('titleView').textContent = document.getElementById('titleInput').value || 'Заголовок';
      document.getElementById('subtitleView').textContent = document.getElementById('subtitleInput').value || '';
      const raw = document.getElementById('contentInput').value.trim();
      const paragraphs = raw.split(/\n{2,}/).map(p => `<p>${p}</p>`).join('');
      document.getElementById('contentView').innerHTML = paragraphs || '<p>Текст отсутствует.</p>';
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const card = document.querySelector('.card');

      // Новый нормальный контейнер
      const container = document.createElement('div');
      container.style.width = card.offsetWidth + 'px';
      container.style.height = card.offsetHeight + 'px';
      container.style.position = 'fixed';
      container.style.top = '0';
      container.style.left = '0';
      container.style.opacity = '0';

      // копируем фон страницы
      container.style.background = getComputedStyle(document.body).background;

      document.body.appendChild(container);

      const clone = card.cloneNode(true);
      clone.style.margin = '0';
      container.appendChild(clone);

      html2canvas(container, { scale: 2 }).then(canvas => {
        canvas.toBlob(blob => {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'fulthma_card.jpg';
          link.click();
          URL.revokeObjectURL(link.href);
          document.body.removeChild(container);
        }, 'image/jpeg', 0.95);
      });
    });
  </script>
</body>
</html>
