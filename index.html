<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Apple-style News Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #121212;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* Размытые круги на фоне */
  .blur-circle {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.3;
    animation: float 20s infinite alternate;
  }
  .circle1 { width: 400px; height: 400px; background: #ff4d6d; top: -100px; left: -100px; }
  .circle2 { width: 300px; height: 300px; background: #4d79ff; bottom: -100px; right: -50px; }
  @keyframes float {
    0% { transform: translate(0,0); }
    100% { transform: translate(50px,50px); }
  }

  /* Карточка Liquid Glass */
  #card {
    position: relative;
    width: 400px;
    min-height: 500px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    border-radius: 25px;
    padding: 30px 25px 25px 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
    text-align: center;
  }

  #logo {
    width: 120px;
    margin-bottom: 20px;
  }

  #text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    outline: none;
    margin-bottom: 20px;
  }

  #date {
    font-size: 14px;
    font-weight: 400;
    color: #bbb;
  }

  #controls {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    justify-content: center;
  }

  input[type="file"] { display: none; }

  label {
    cursor: pointer;
    background: #4caf50;
    padding: 10px 15px;
    border-radius: 10px;
    color: white;
    font-weight: 600;
  }

  #downloadBtn {
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    background: #2196f3;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Размытые круги -->
<div class="blur-circle circle1"></div>
<div class="blur-circle circle2"></div>

<div id="card">
  <img id="logo" src="" alt="Лого">
  <div id="text" contenteditable="true">Напиши сюда текст новости...</div>
  <div id="date" contenteditable="true">15 ноября 2025</div>
</div>

<div id="controls">
  <label for="logoInput">Загрузить лого</label>
  <input type="file" id="logoInput" accept="image/*">
  <button id="downloadBtn">Скачать JPG</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // Загрузка лого
  const logoInput = document.getElementById('logoInput');
  const logoImg = document.getElementById('logo');
  logoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(event){
        logoImg.src = event.target.result;
      }
      reader.readAsDataURL(file);
    }
  });

  // Скачать карточку как JPG
  const btn = document.getElementById('downloadBtn');
  btn.addEventListener('click', () => {
    const card = document.getElementById('card');
    html2canvas(card).then(canvas => {
      const link = document.createElement('a');
      link.download = 'news_card.jpg';
      link.href = canvas.toDataURL("image/jpeg", 0.9);
      link.click();
    });
  });
</script>

</body>
</html>
